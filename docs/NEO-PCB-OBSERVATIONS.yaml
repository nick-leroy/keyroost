observations:
  - id: usb_contact_stubs
    relation: visually_contiguous_on_reverse_face
    pairs:
      - [R-J1-1, R-L1]
      - [R-J1-2, R-L2]
      - [R-J1-3, R-L3]
      - [R-J1-4, R-L4]
    limit: round lands are via candidates; destinations and USB signal names unknown
  - id: neck_four_land_pattern
    relation: candidate_group_cross_face
    front_features: [F-L1, F-L2, F-L3, F-L4]
    reverse_features: [R-L1, R-L2, R-L3, R-L4]
    evidence: visible
    limit: similar four-land pattern around the same connector hole; individual pairings require face registration or continuity
  - id: controller_east_fan
    relation: visible_track_fan
    feature: F-U2
    package_sides: [right]
    approximate_route_region_px: [680, 240, 752, 343]
    toward: connector neck and local round lands
    limit: cannot label these tracks D+/D-; candidate LPC11U24 pinout places USB_DM and USB_DP on the left edge
  - id: secure_element_fan
    relation: visible_track_fan
    feature: F-U1
    package_sides: [right, bottom]
    toward_feature: F-PASSIVES
    limit: tracks disappear under parts or at round lands; no U1-to-U2 net identified
  - id: metal_can_area
    relation: visible_tracks
    feature: F-METAL-CAN
    toward_feature: F-U2
    toward_package_side: top
    limit: resonator identity is source-attributed; individual pads and frequency unverified
  - id: antenna_perimeter
    relation: source_attributed_function
    feature: R-KEYRING-PERIMETER
    function: NFC antenna routing near keyring hole
    source: https://web.archive.org/web/20170926081041/http://www.hexview.com/~scl/neo/
    limit: neither antenna terminal nor A7005 pad identified
conditional_pin_geometry:
  feature: F-U2
  evidence: conditional_inference
  assumptions:
    - package is the LPC11U24 HVQFN33 identified by NXP and NinjaLab
    - visible dot near the upper-right package corner marks terminal 1
    - datasheet top-view pin map is rotated clockwise 90 degrees to match the photo
  source: https://www.nxp.com/docs/en/data-sheet/LPC11U2X.pdf
  candidates:
    - {pin: 9, function: PIO0_3/USB_VBUS, photo_side: left, approximate_pad_px: [557, 247]}
    - {pin: 13, function: USB_DM, photo_side: left, approximate_pad_px: [557, 294]}
    - {pin: 14, function: USB_DP, photo_side: left, approximate_pad_px: [557, 305]}
    - {pin: 4, function: XTALIN, photo_side: top, approximate_pad_px: [626, 224]}
    - {pin: 5, function: XTALOUT, photo_side: top, approximate_pad_px: [615, 224]}
  limit: candidate pad positions only; no pad-to-track or contact-to-pin net established
unresolved:
  - USB contact order by VBUS, D-, D+, and GND on this photographed board
  - whether each R-L land is a plated via and which F-L land is its opposite-face endpoint
  - front-to-reverse image registration
  - USB-derived voltage conversion, supply rails, decoupling, and ground return
  - any F-U1 to F-U2 electrical net or inter-chip protocol
  - NFC antenna terminals and their route to F-U1
  - touch-disc net and its destination
  - LED and resonator pad-to-pin routes
  - PCB layer count, hidden routing, and pin 1 orientation for each package
