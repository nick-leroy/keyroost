# Image observation graph for the NEO board pictured by HexView.
# Pixel positions are approximate waypoints for reinspection, not PCB dimensions.
# No observed connection establishes a net, package pin identity, or layer transition.
# Candidate MCU pin numbers below depend on explicit identity/orientation assumptions.
schema_version: 1
board_sample: HexView YubiKey NEO teardown, one opened unit
sources:
  front:
    url: https://web.archive.org/web/20170917163058im_/http://www.hexview.com/~scl/neo/neo_pcb_s.jpg
    width_px: 1024
    height_px: 408
    description: component face; USB plug at right
  reverse:
    url: https://web.archive.org/web/20170917163058im_/http://www.hexview.com/~scl/neo/neo_pcb_back_s.jpg
    width_px: 1024
    height_px: 411
    description: contact and touch face; USB plug at right
  nxp_bundle:
    url: https://www.nxp.com/company/about-nxp/smarter-world-videos/CONTACT-AND-CONTACTLESS-KEY
    description: NXP identifies the Yubico cloud key A7005/LPC11U24 chip bundle
  nxp_lpc_pinout:
    url: https://www.nxp.com/docs/en/data-sheet/LPC11U2X.pdf
    description: HVQFN33 top-view pin diagram, page 5
  ninjalab_neo:
    url: https://hardwear.io/wp-content/uploads/2026/04/security-of-Hardware-FIDO2-tokens.pdf
    description: 2022 presentation, slide 17, identifies NEO parts using the HexView photo
coordinate_convention: origin at upper left of each published image; x right, y down
face_registration: unknown; do not equate same x/y on opposite faces
evidence_terms:
  visible: feature or apparent same-face copper continuity in the photograph
  source_attributed: function assigned by HexView or NinjaLab, without electrical verification
  manufacturer_documented: function or part identity asserted by NXP or Yubico
  conditional_inference: follows only if its listed package and orientation assumptions hold
  electrically_verified: continuity or signal measurement; none recorded here
